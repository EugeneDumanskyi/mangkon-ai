# Native sources compiled into the parser workers (ADR-0014, NFR-MNT-01, NFR-SEC-11).
#
# build.rs fetches each file with the system `curl` into `target/mk-native-cache/`, checks its
# SHA-256 and fails the build on a mismatch. Set MK_NATIVE_SRC_DIR to a folder that holds these
# files (by `file` name) to build offline; nothing is downloaded then.
#
# GitHub publishes no digest for tag archives or for files in a tag, so the SHA-256 values were
# pinned on first download (2026-10-24), as in M0c. The tessdata value matches
# spikes/pdf-bakeoff/ocr-models.json. To bump a version: change `version`, `url` and `file`,
# download once, check the release notes, and pin the new hash.

