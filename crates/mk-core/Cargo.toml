[package]
name = "mk-core"
description = "Application services: wires the context crates together. No Tauri (ADR-0002)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Spike S2d (M2a): synthetic connection rows for the WebKitGTK scroll test. Not in shipped builds.
spike-s2d = ["dep:serde"]
# The stand-in llama-server for the M5c tests (dev-dependencies only).
testkit = ["mk-models/testkit"]

# The stand-in llama-server of `mk-models`, built for this crate's tests (a test can only run
# binaries of its own package). Never shipped.
[[bin]]
name = "mk-core-fake-llama-server"
path = "src/bin/mk-core-fake-llama-server.rs"
required-features = ["testkit"]

[dependencies]
mk-ai.workspace = true
mk-kernel.workspace = true
mk-workspace.workspace = true
mk-corpus.workspace = true
mk-parsers.workspace = true
mk-identifiers.workspace = true
mk-jobs.workspace = true
mk-graph.workspace = true
mk-mapping.workspace = true
mk-search.workspace = true
mk-store.workspace = true
mk-worker.workspace = true
mk-egress.workspace = true
mk-models.workspace = true
# Endpoint ids: 128 random bits (domain §5.2).
getrandom = "0.3.4"
serde = { version = "1.0.229", features = ["derive"], optional = true }
# The demo files' ground truth (US-14.4).
serde_json = "1.0.154"
# Worker RSS for the memory watchdog and the Stage A peak (ADR-0007).
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[dev-dependencies]
mk-core = { path = ".", features = ["testkit"] }
mk-egress = { workspace = true, features = ["testkit"] }
mk-models = { workspace = true, features = ["testkit"] }
mk-bench.workspace = true
proptest = "1.12.0"
tempfile = "3.27.0"
