[package]
name = "mk-kernel"
description = "Shared kernel: evidence value objects (no I/O)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Serde derives for the value objects that cross the worker protocol (ADR-0007). No I/O.
serde = ["dep:serde"]

[dependencies]
blake3 = { version = "1.8.7", features = ["pure"] }
serde = { version = "1.0.229", features = ["derive"], optional = true }

[dev-dependencies]
proptest = "1.12.0"
