[package]
name = "mk-parsers"
description = "BC-02 parsers and OCR adapters, used by parser workers."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
csv = "1.4.0"
encoding_rs = "0.8.42"
hayro = "0.8.0"
html5ever = "0.39.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff", "webp"] }
mail-parser = { version = "0.11.9", default-features = false }
mk-kernel.workspace = true
mk-tesseract-sys.workspace = true
quick-xml = "0.42.0"
serde = "1.0.229"
serde_json = "1.0.154"
tiff = "0.11.3"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
ab_glyph = "0.2.32"
mk-bench.workspace = true
proptest = "1.12.0"
tempfile = "3.27.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
