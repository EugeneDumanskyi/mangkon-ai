[package]
name = "mk-worker"
description = "Parser worker (ADR-0007): framed protocol and the worker loop. Runs in --worker processes."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
mk-identifiers.workspace = true
mk-kernel = { workspace = true, features = ["serde"] }
mk-parsers.workspace = true
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }

# The coarse address-space cap a worker sets on itself (ADR-0007, Linux only).
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["std", "process"] }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
