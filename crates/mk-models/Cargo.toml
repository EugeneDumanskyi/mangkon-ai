[package]
name = "mk-models"
description = "BC-12: model catalog, hardware check and model downloads (the runtime supervisor comes in M5c)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# ADR-0009: model downloads, GET only, to catalog hosts. Same client and TLS set-up as
# mk-egress: rustls with ring, roots from the OS through rustls-platform-verifier. The resolver
# API is unversioned in ureq, so the version is pinned exactly.
ureq = { version = "=3.5.0", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
url = "2.5.8"
# INV-MM-01, NFR-SEC-11: SHA-256 over the bytes as they are written.
sha2 = "0.10.9"
# US-09.1: RAM, CPU and free disk.
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk"] }

[features]
# A fake Hugging Face, a recording resolver and test catalogs (dev-dependencies only).
testkit = []

[dev-dependencies]
mk-models = { path = ".", features = ["testkit"] }
tempfile = "3.27.0"
