[package]
name = "corpus-gen"
description = "Deterministic generator for the TD-1 synthetic corpus and TD-3 broken-file set."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
mk-bench.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rand_chacha = "0.10.0"
libm = "0.2.16"
flate2 = "1.1.10"
ab_glyph = "0.2.32"
png = "0.18.1"
jpeg-encoder = "0.7.1"
tiff = { version = "0.11.3", default-features = false, features = ["lzw"] }
image-webp = "0.2.4"
encoding_rs = "0.8.42"
md-5 = "0.11.0"
base64 = "0.23.1"
bs58 = { version = "0.5.1", features = ["check"] }
bech32 = "0.12.0"
sha2 = "0.11.1"
sha3 = "0.12.0"
crc32fast = "1.5.3"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

