[package]
name = "model-check"
description = "Spike S1: local model reality check over TD-1 (M1, throwaway)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mk-bench = { path = "../../crates/mk-bench" }
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order: the JSON schema keeps its property order (name, type, evidence, confidence),
# which is the order the grammar makes the model write them.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
# Loopback only (127.0.0.1): no TLS. The main workspace's HTTP rule (ADR-0009) does not cover spikes/.
ureq = { version = "3.5.0", default-features = false, features = ["json"] }
mail-parser = "0.11.9"
encoding_rs = "0.8.42"
getrandom = "0.4.3"
half = "2.7.1"
