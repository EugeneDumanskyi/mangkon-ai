[package]
name = "pdf-bakeoff"
description = "Spike S0: PDF and OCR engine bake-off over TD-1/TD-3 (M0b/M0c, throwaway)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
hayro = ["dep:hayro"]
oxide = ["dep:pdf_oxide"]
pdfium = ["dep:pdfium-render"]
# OCR candidates (M0c). Each pulls in the shared image path and hayro, which rasterises
# scanned PDF pages.
ocr = ["hayro", "dep:image"]
ocrs = ["ocr", "dep:ocrs", "dep:rten"]
tesseract = ["ocr", "dep:tesseract-rs"]
onnx = ["ocr", "dep:oar-ocr", "dep:ort"]

[dependencies]
mk-bench = { path = "../../crates/mk-bench" }
mk-kernel = { path = "../../crates/mk-kernel" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

hayro = { version = "0.8.0", optional = true }
pdf_oxide = { version = "0.3.78", optional = true, features = ["rendering"] }
pdfium-render = { version = "0.9.4", optional = true }

image = { version = "0.25.10", optional = true, default-features = false, features = ["png", "jpeg", "tiff"] }
ocrs = { version = "0.13.1", optional = true, default-features = false, features = ["rten"] }
rten = { version = "0.26.0", optional = true, default-features = false, features = ["rten_format"] }
tesseract-rs = { version = "0.4.0", optional = true }
oar-ocr = { version = "0.10.1", optional = true, default-features = false, features = ["simd"] }
# Named only to pick its features: the build script downloads ONNX Runtime, and rustls avoids
# needing the system OpenSSL headers that oar-ocr's default (native TLS) asks for.
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["download-binaries", "tls-rustls"] }
