# Throwaway harness of spike S1 (M1 local models). Not part of the main workspace. It stays until
# the M6 LLM benchmark (NFR-MNT-06) replaces it. Spike S0's pdf-bakeoff was removed in M3b, once
# its PDF and OCR code moved into mk-parsers.
