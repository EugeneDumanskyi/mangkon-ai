[package]
name = "mangkon-cli"
description = "Mangkon AI command line: ingest, rebuild, project management, the kill-test driver and the TD-1 benches."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "mangkon-cli"

[lints]
workspace = true

[features]
# The stand-in llama-server for the AI kill test (dev-dependencies only).
testkit = ["dep:mk-models", "mk-models/testkit"]

# Holds nothing: a package needs a library target for its tests to turn on its own feature.
[lib]
name = "mangkon_cli_tests"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "mangkon-cli"
path = "src/main.rs"

# The stand-in llama-server of `mk-models`, built for this crate's tests (a test can only run
# binaries of its own package). Never shipped.
[[bin]]
name = "mangkon-cli-fake-llama-server"
path = "src/bin/mangkon-cli-fake-llama-server.rs"
required-features = ["testkit"]

[dependencies]
mk-bench.workspace = true
mk-core.workspace = true
mk-search.workspace = true
serde = "1.0.229"
serde_json = "1.0.154"
tempfile = "3.27.0"

# Only the stand-in llama-server uses it (feature `testkit`).
mk-models = { workspace = true, optional = true }

[dev-dependencies]
mangkon-cli = { path = ".", features = ["testkit"] }
mk-egress = { workspace = true, features = ["testkit"] }
mk-models = { workspace = true, features = ["testkit"] }
mk-store.workspace = true
