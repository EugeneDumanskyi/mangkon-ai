[workspace]
resolver = "3"
members = [
    "crates/mk-kernel",
    "crates/mk-workspace",
    "crates/mk-corpus",
    "crates/mk-tesseract-sys",
    "crates/mk-parsers",
    "crates/mk-identifiers",
    "crates/mk-mapping",
    "crates/mk-jobs",
    "crates/mk-graph",
    "crates/mk-search",
    "crates/mk-store",
    "crates/mk-worker",
    "crates/mk-core",
    "crates/mk-bench",
    "crates/mk-models",
    "apps/desktop",
    "apps/cli",
    "tools/corpus-gen",
    "tools/xtask",
]
# Throwaway spike harnesses (M0b/M0c, M1) are never workspace members.
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
mk-kernel = { path = "crates/mk-kernel" }
mk-bench = { path = "crates/mk-bench" }
mk-workspace = { path = "crates/mk-workspace" }
mk-corpus = { path = "crates/mk-corpus" }
mk-tesseract-sys = { path = "crates/mk-tesseract-sys" }
mk-parsers = { path = "crates/mk-parsers" }
mk-identifiers = { path = "crates/mk-identifiers" }
mk-mapping = { path = "crates/mk-mapping" }
mk-jobs = { path = "crates/mk-jobs" }
mk-graph = { path = "crates/mk-graph" }
mk-search = { path = "crates/mk-search" }
mk-store = { path = "crates/mk-store" }
mk-worker = { path = "crates/mk-worker" }
mk-core = { path = "crates/mk-core" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
