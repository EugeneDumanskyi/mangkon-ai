[workspace]
resolver = "3"
members = ["crates/mk-kernel", "crates/mk-bench", "tools/corpus-gen"]
# Throwaway bake-off harnesses (M0b/M0c) are never workspace members.
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
mk-kernel = { path = "crates/mk-kernel" }
mk-bench = { path = "crates/mk-bench" }

[profile.dev.package."*"]
opt-level = 2
